key: cashier_flow
layer: promo
owner: payments
hypothesis: >
  A one-page cashier instead of three steps raises 7-day deposit conversion.
start: 2026-09-01
enrollment_days: 14
window_days: 7
pre_days: 14
# Shares the promo layer with welcome_bonus, so it gets the other half of the buckets and no
# player can be in both.
buckets: [5000, 9999]
variants:
  - { name: control, weight: 50 }
  - { name: treatment, weight: 50 }
primary: deposit_conversion
secondary: [deposit_per_player]
guardrails:
  - { metric: ggr_per_player, max_relative_drop: 0.05 }
design:
  alpha: 0.05
  power: 0.8
  mde: 0.05

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, unit tests, definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Experiment definitions and the metric catalog are consistent
        run: gamma check
      - name: Dashboards are up to date with their builder
        run: |
          python grafana/build_dashboards.py
          git diff --exit-code grafana/dashboards
      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet

  e2e:
    name: ClickHouse end to end
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Start ClickHouse and Grafana
        run: docker compose -f deploy/docker-compose.yml up -d --wait
      - name: "Apply the schema (twice, the second run must be a no-op)"
        run: |
          gamma migrate
          gamma migrate | grep -q "up to date"
      - name: Simulate, build marts, check them against an independent recomputation
        run: pytest -m e2e tests/e2e -v --tb=short -rA
      - name: Show the arms
        run: gamma status
      - name: Plan and analyse every experiment
        run: |
          for e in welcome_bonus cashier_flow lobby_layout; do
            gamma plan $e
            gamma analyze $e
          done
      - name: "Reports: verdict of every experiment, stored, and the expected decisions"
        run: |
          gamma report --all --out /tmp/reports --save | tee /tmp/decisions.txt
          grep -E "welcome_bonus +SHIP" /tmp/decisions.txt
          grep -E "cashier_flow +INVALID" /tmp/decisions.txt
          grep -E "lobby_layout +NO_EFFECT" /tmp/decisions.txt
      - name: Grafana is up with the ClickHouse datasource and the dashboard
        run: |
          curl -sf -u admin:admin localhost:3000/api/datasources | grep -q grafana-clickhouse-datasource
          curl -sf -u admin:admin localhost:3000/api/dashboards/uid/gamma-experiment | grep -q "Gamma"
      - name: Export for BI tools
        run: gamma export --out /tmp/export && test -s /tmp/export/experiment_results.csv
      - name: Benchmarks run end to end (small sizes, the numbers are not the published ones)
        run: gamma bench --sizes 10000 20000 --out /tmp/benchmarks.md
      - name: The method checks run end to end (a short run, the numbers are not the published ones)
        run: gamma validate --trials 100 --out /tmp/validation.md
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200

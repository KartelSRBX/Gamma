[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gamma"
version = "0.1.0"
description = "An A/B testing platform for an iGaming product: assignment, exposure logging, ClickHouse marts, and statistics that are checked by simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "clickhouse-connect>=0.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gamma = "gamma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gamma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: needs the running docker stack (make up)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["gamma"]

[tool.ruff.lint.per-file-ignores]
# SQL and long literals read better unwrapped
"src/gamma/marts.py" = ["E501"]
"src/gamma/stats/validation_report.py" = ["E501"]
"src/gamma/report.py" = ["E501"]
"src/gamma/bench.py" = ["E501", "B023"]
"src/gamma/cli.py" = ["E501"]
"grafana/build_dashboards.py" = ["E501"]
"src/gamma/verdict.py" = ["E501"]
"tests/**" = ["E501"]
